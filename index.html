<!DOCTYPE html>
<html lang="tr">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Sistemi - Animasyonlu Giriş</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .splash-screen {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease, transform 1s ease;
        }

        .logo {
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            animation: pulse 2s infinite, rotate 4s linear infinite;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        .logo-inner {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #6a11cb;
            font-size: 24px;
        }

        .title {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-align: center;
            opacity: 0;
            animation: fadeInUp 1s ease 0.5s forwards;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeInUp 1s ease 1s forwards;
            text-align: center;
        }

        .loading-bar {
            width: 300px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeIn 1s ease 1.5s forwards;
        }

        .loading-progress {
            height: 100%;
            width: 0%;
            background: white;
            border-radius: 3px;
            animation: loading 3s ease 2s forwards;
        }

        .continue-btn {
            padding: 12px 40px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeIn 1s ease 2.5s forwards;
            backdrop-filter: blur(5px);
        }

        .continue-btn:hover {
            background: white;
            color: #6a11cb;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .registration-container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            margin-top: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease, transform 1s ease;
        }

        .registration-container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .registration-title {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            background: white;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.5);
        }

        .form-select {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            cursor: pointer;
        }

        .form-textarea {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            resize: vertical;
            min-height: 120px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .checkbox-group input {
            margin-right: 10px;
            transform: scale(1.2);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: white;
            color: #6a11cb;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #f0f0f0;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .form-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
        }

        .form-footer a {
            color: white;
            text-decoration: underline;
        }

        .success-message {
            background: rgba(46, 204, 113, 0.2);
            border: 1px solid rgba(46, 204, 113, 0.5);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
            display: none;
        }

        /* Animations */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes loading {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .title {
                font-size: 2.5rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }
            
            .logo {
                width: 100px;
                height: 100px;
            }
            
            .logo-inner {
                width: 60px;
                height: 60px;
                font-size: 18px;
            }
            
            .registration-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Giriş Ekranı -->
        <div class="splash-screen" id="splashScreen">
            <div class="logo">
                <div class="logo-inner"><i class="fas fa-user-plus"></i></div>
            </div>
            <h1 class="title">KAYIT SİSTEMİ</h1>
            <p class="subtitle">Hesabınızı oluşturun ve bize katılın</p>
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
            <button class="continue-btn" id="continueBtn">Kayıt Ol</button>
        </div>

        <!-- Kayıt Formu -->
        <div class="registration-container" id="registrationContainer">
            <h2 class="registration-title">Yeni Hesap Oluştur</h2>
            
            <form id="registrationForm">
                <div class="form-group">
                    <label class="form-label" for="fullName">Ad Soyad</label>
                    <input type="text" id="fullName" class="form-input" placeholder="Adınız ve soyadınız" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="email">E-posta Adresi</label>
                    <input type="email" id="email" class="form-input" placeholder="E-posta adresiniz" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="phone">Telefon Numarası</label>
                    <input type="tel" id="phone" class="form-input" placeholder="Telefon numaranız" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Şifre</label>
                    <input type="password" id="password" class="form-input" placeholder="Şifreniz" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Şifre Tekrar</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="Şifrenizi tekrar girin" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="birthDate">Doğum Tarihi</label>
                    <input type="date" id="birthDate" class="form-input" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="country">Ülke</label>
                    <select id="country" class="form-select" required>
                        <option value="">Ülke seçin</option>
                        <option value="turkey">Türkiye</option>
                        <option value="usa">Amerika Birleşik Devletleri</option>
                        <option value="germany">Almanya</option>
                        <option value="france">Fransa</option>
                        <option value="uk">Birleşik Krallık</option>
                        <option value="other">Diğer</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="bio">Kendinizi Tanıtın</label>
                    <textarea id="bio" class="form-textarea" placeholder="Kendiniz hakkında kısa bir tanıtım yazın..."></textarea>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">Kullanım koşullarını ve gizlilik politikasını kabul ediyorum</label>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="newsletter">
                    <label for="newsletter">E-posta ile kampanya ve duyuruları almak istiyorum</label>
                </div>
                
                <button type="submit" class="submit-btn">Hesabı Oluştur</button>
                
                <div class="success-message" id="successMessage">
                    <i class="fas fa-check-circle"></i> Kaydınız başarıyla tamamlandı! Yönlendiriliyorsunuz...
                </div>
            </form>
            
            <div class="form-footer">
                Zaten hesabınız var mı? <a href="#">Giriş yapın</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const splashScreen = document.getElementById('splashScreen');
            const registrationContainer = document.getElementById('registrationContainer');
            const continueBtn = document.getElementById('continueBtn');
            const registrationForm = document.getElementById('registrationForm');
            const successMessage = document.getElementById('successMessage');
            
            // Otomatik geçiş için (5 saniye sonra)
            setTimeout(function() {
                showRegistrationForm();
            }, 5000);
            
            // Butona tıklanınca geçiş
            continueBtn.addEventListener('click', showRegistrationForm);
            
            function showRegistrationForm() {
                // Giriş ekranını gizle
                splashScreen.style.opacity = '0';
                splashScreen.style.transform = 'scale(1.1)';
                
                // Kayıt formunu göster
                setTimeout(function() {
                    splashScreen.style.display = 'none';
                    registrationContainer.classList.add('visible');
                }, 1000);
            }
            
            // Form gönderimi
            registrationForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Şifre kontrolü
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                
                if (password !== confirmPassword) {
                    alert('Şifreler eşleşmiyor! Lütfen kontrol edin.');
                    return;
                }
                
                // Başarılı kayıt mesajını göster
                successMessage.style.display = 'block';
                
                // Formu sıfırla
                setTimeout(function() {
                    registrationForm.reset();
                    successMessage.style.display = 'none';
                    
                    // Başarı animasyonu
                    registrationContainer.style.transform = 'scale(0.95)';
                    setTimeout(function() {
                        registrationContainer.style.transform = 'scale(1)';
                    }, 300);
                    
                    alert('Kaydınız başarıyla tamamlandı! Hoş geldiniz.');
                }, 2000);
            });
        });
    </script>
</body>
</html>
