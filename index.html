<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Görsel Kırpıcı </title>
<style>
    :root {
        --bg-main: #0b0d12;
        --bg-surface: #12151c;
        --bg-elevated: #181c26;
        --accent: #00f3ff;
        --accent-soft: rgba(0, 243, 255, 0.15);
        --text: #e6ecf5;
        --text-muted: #6b7688;
        --border: #232838;
        --radius: 14px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background:
            radial-gradient(circle at 15% 0%, rgba(0,243,255,0.06), transparent 45%),
            var(--bg-main);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px 16px 90px;
    }

    header { text-align: center; margin-bottom: 22px; max-width: 480px; }
    header h1 { font-size: clamp(22px, 5vw, 30px); font-weight: 800; color: #fff; letter-spacing: -0.02em; }
    header h1 span { color: var(--accent); }
    header p { color: var(--text-muted); margin-top: 6px; font-size: 13.5px; }

    .main-container {
        display: grid;
        grid-template-columns: 1fr 300px;
        gap: 20px;
        max-width: 1100px;
        width: 100%;
    }

    .workspace {
        background: var(--bg-surface);
        border: 1.5px dashed var(--border);
        border-radius: var(--radius);
        padding: 16px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 420px;
        position: relative;
        overflow: hidden;
        touch-action: none;
    }

    .upload-trigger { text-align: center; cursor: pointer; color: var(--text-muted); padding: 30px 16px; }
    .upload-trigger:hover { color: var(--accent); }
    .upload-trigger svg { width: 44px; height: 44px; margin-bottom: 12px; stroke: currentColor; }
    .upload-trigger p { font-weight: 600; font-size: 14.5px; color: var(--text); }
    .upload-trigger span { font-size: 12.5px; display: block; margin-top: 4px; }
    #file-input { display: none; }

    .crop-wrapper {
        position: relative;
        display: none;
        max-width: 100%;
        line-height: 0;
        touch-action: none;
    }

    #source-image {
        max-width: 100%;
        max-height: 62vh;
        display: block;
        user-select: none;
        -webkit-user-drag: none;
        pointer-events: none;
        border-radius: 4px;
    }

    .crop-box {
        position: absolute;
        box-sizing: border-box;
        border: 2px solid var(--accent);
        cursor: move;
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.65);
        touch-action: none;
    }
    .crop-box.round { border-radius: 50%; }
    .crop-box.round .crop-grid { border-radius: 50%; overflow: hidden; }

    .crop-grid {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        pointer-events: none;
    }
    .crop-grid::before, .crop-grid::after { content: ''; position: absolute; }
    .crop-grid::before {
        top: 33.33%; bottom: 33.33%; left: 0; right: 0;
        border-top: 1px dashed rgba(0,243,255,0.35); border-bottom: 1px dashed rgba(0,243,255,0.35);
    }
    .crop-grid::after {
        left: 33.33%; right: 33.33%; top: 0; bottom: 0;
        border-left: 1px dashed rgba(0,243,255,0.35); border-right: 1px dashed rgba(0,243,255,0.35);
    }

    .handle {
        position: absolute;
        width: 26px; height: 26px;
        display: flex; align-items: center; justify-content: center;
        z-index: 10;
        touch-action: none;
    }
    .handle::after {
        content: '';
        width: 13px; height: 13px;
        background-color: #fff;
        border: 2px solid var(--accent);
        border-radius: 50%;
        display: block;
    }
    .handle-tl { top: -13px; left: -13px; cursor: nwse-resize; }
    .handle-tr { top: -13px; right: -13px; cursor: nesw-resize; }
    .handle-bl { bottom: -13px; left: -13px; cursor: nesw-resize; }
    .handle-br { bottom: -13px; right: -13px; cursor: nwse-resize; }

    .control-panel {
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        align-self: start;
    }

    .panel-label {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-muted);
        margin-bottom: 10px;
    }

    .shape-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
    }

    .shape-btn {
        background: var(--bg-elevated);
        border: 1.5px solid var(--border);
        border-radius: 10px;
        color: var(--text-muted);
        padding: 10px 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        font-size: 10.5px;
        font-weight: 600;
        transition: border-color .15s, color .15s, background .15s;
    }
    .shape-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; }
    .shape-btn:hover { color: var(--text); border-color: #34405a; }
    .shape-btn.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

    .preview-box {
        width: 100%; height: 160px;
        background:
            repeating-conic-gradient(#1c2130 0% 25%, #161a24 0% 50%) 50% / 16px 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        display: flex; justify-content: center; align-items: center;
    }
    #preview-canvas { max-width: 100%; max-height: 100%; }
    #preview-canvas.round-preview { border-radius: 50%; }

    .btn {
        background: #fff; color: #000; border: none;
        padding: 13px 20px; border-radius: 10px;
        font-weight: 700; font-size: 14px; cursor: pointer; width: 100%;
        transition: transform .12s, opacity .12s;
        display: flex; justify-content: center; align-items: center; gap: 8px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-action { background: var(--accent); color: #04191c; }
    .btn-action:disabled { opacity: 0.4; pointer-events: none; }
    .btn-reset { background: transparent; border: 1.5px solid var(--border); color: var(--text); }

    footer {
        position: fixed;
        bottom: 14px;
        right: 16px;
        z-index: 50;
    }
    .signature {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 13px;
        background: rgba(18, 21, 28, 0.85);
        backdrop-filter: blur(6px);
        border: 1px solid var(--border);
        border-radius: 999px;
        font-size: 11.5px;
        color: var(--text-muted);
        letter-spacing: 0.02em;
    }
    .signature b {
        color: var(--accent);
        font-weight: 700;
    }
    .signature .dot {
        width: 5px; height: 5px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 6px var(--accent);
    }

    @media (max-width: 820px) {
        .main-container {
            grid-template-columns: 1fr;
        }
        .control-panel {
            order: -1;
        }
        .shape-grid { grid-template-columns: repeat(5, 1fr); }
    }

    @media (max-width: 480px) {
        body { padding: 16px 10px 80px; }
        .workspace { min-height: 320px; padding: 10px; }
        #source-image { max-height: 50vh; }
        .control-panel { padding: 14px; gap: 14px; }
        .shape-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .shape-btn { padding: 8px 4px; font-size: 10px; }
        .preview-box { height: 130px; }
        footer { right: 10px; bottom: 10px; }
        .signature { font-size: 10.5px; padding: 6px 11px; }
        .handle { width: 30px; height: 30px; }
        .handle-tl { top: -15px; left: -15px; }
        .handle-tr { top: -15px; right: -15px; }
        .handle-bl { bottom: -15px; left: -15px; }
        .handle-br { bottom: -15px; right: -15px; }
    }
</style>
</head>
<body>

<header>
    <h1>Görsel <span>Kırpıcı</span></h1>
    <p>Resmi sürükleyin, köşelerden büyütün, şekil seçin ve indirin.</p>
</header>

<div class="main-container">
    <div class="workspace" id="drop-zone">
        <label class="upload-trigger" id="upload-ui">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" /></svg>
            <p>Resmi buraya yükleyin</p>
            <span>veya dokunup galeriden seçin</span>
            <input type="file" id="file-input" accept="image/*">
        </label>

        <div class="crop-wrapper" id="crop-wrapper">
            <img id="source-image" alt="Kaynak">
            <div class="crop-box" id="crop-box">
                <div class="crop-grid"></div>
                <div class="handle handle-tl" data-handle="tl"></div>
                <div class="handle handle-tr" data-handle="tr"></div>
                <div class="handle handle-bl" data-handle="bl"></div>
                <div class="handle handle-br" data-handle="br"></div>
            </div>
        </div>
    </div>

    <div class="control-panel">
        <div>
            <div class="panel-label">Kırpma Şekli</div>
            <div class="shape-grid" id="shape-grid">
                <button class="shape-btn active" data-shape="free" data-ratio="0">
                    <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>
                    Serbest
                </button>
                <button class="shape-btn" data-shape="square" data-ratio="1">
                    <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1"/></svg>
                    Kare
                </button>
                <button class="shape-btn" data-shape="circle" data-ratio="1">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
                    Daire
                </button>
                <button class="shape-btn" data-shape="portrait" data-ratio="0.8">
                    <svg viewBox="0 0 24 24"><rect x="7" y="4" width="10" height="16" rx="1"/></svg>
                    4:5
                </button>
                <button class="shape-btn" data-shape="wide" data-ratio="1.778">
                    <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="1"/></svg>
                    16:9
                </button>
                <button class="shape-btn" data-shape="story" data-ratio="0.5625">
                    <svg viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="18" rx="1"/></svg>
                    9:16
                </button>
            </div>
        </div>

        <div>
            <div class="panel-label">Önizleme</div>
            <div class="preview-box">
                <canvas id="preview-canvas"></canvas>
            </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px;">
            <button class="btn btn-action" id="download-btn" disabled>Kırp ve İndir</button>
            <button class="btn btn-reset" id="reset-btn">Resmi Değiştir</button>
        </div>
    </div>
</div>

<footer>
    <span class="signature"><span class="dot"></span>Made by <b>Zeld</b></span>
</footer>

<script>
(function () {
    const fileInput = document.getElementById('file-input');
    const uploadUi = document.getElementById('upload-ui');
    const cropWrapper = document.getElementById('crop-wrapper');
    const sourceImg = document.getElementById('source-image');
    const cropBox = document.getElementById('crop-box');
    const previewCanvas = document.getElementById('preview-canvas');
    const downloadBtn = document.getElementById('download-btn');
    const resetBtn = document.getElementById('reset-btn');
    const shapeButtons = document.querySelectorAll('.shape-btn');

    let currentAction = null;
    let activeHandle = null;
    let startX, startY, startLeft, startTop, startWidth, startHeight;
    let activeRatio = 0;
    let activeShape = 'free';
    let pointerId = null;

    function clientPos(e) {
        if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        return { x: e.clientX, y: e.clientY };
    }

    fileInput.addEventListener('change', () => {
        const file = fileInput.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            sourceImg.src = e.target.result;
            sourceImg.onload = () => {
                uploadUi.style.display = 'none';
                cropWrapper.style.display = 'block';

                const w = sourceImg.clientWidth;
                const h = sourceImg.clientHeight;
                const size = Math.min(w, h) * 0.6;

                cropBox.style.width = size + 'px';
                cropBox.style.height = size + 'px';
                cropBox.style.left = ((w - size) / 2) + 'px';
                cropBox.style.top = ((h - size) / 2) + 'px';

                downloadBtn.disabled = false;
                updatePreview();
            };
        };
        reader.readAsDataURL(file);
    });

    shapeButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            shapeButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeShape = btn.dataset.shape;
            activeRatio = parseFloat(btn.dataset.ratio);
            cropBox.classList.toggle('round', activeShape === 'circle');

            if (activeRatio > 0 && sourceImg.clientWidth) {
                const maxW = cropWrapper.clientWidth;
                const maxH = sourceImg.clientHeight;
                let newW = cropBox.offsetWidth;
                let newH = newW / activeRatio;

                if (newH > maxH) {
                    newH = maxH;
                    newW = newH * activeRatio;
                }
                if (newW > maxW) {
                    newW = maxW;
                    newH = newW / activeRatio;
                }

                let left = cropBox.offsetLeft;
                let top = cropBox.offsetTop;
                if (left + newW > maxW) left = Math.max(0, maxW - newW);
                if (top + newH > maxH) top = Math.max(0, maxH - newH);

                cropBox.style.width = newW + 'px';
                cropBox.style.height = newH + 'px';
                cropBox.style.left = left + 'px';
                cropBox.style.top = top + 'px';
            }
            updatePreview();
        });
    });

    cropBox.addEventListener('pointerdown', startAction);

    function startAction(e) {
        e.preventDefault();
        const pos = clientPos(e);
        pointerId = e.pointerId;
        cropBox.setPointerCapture && e.pointerId !== undefined && cropBox.setPointerCapture(e.pointerId);

        startX = pos.x;
        startY = pos.y;
        startLeft = cropBox.offsetLeft;
        startTop = cropBox.offsetTop;
        startWidth = cropBox.offsetWidth;
        startHeight = cropBox.offsetHeight;

        if (e.target.classList.contains('handle')) {
            currentAction = 'resize';
            activeHandle = e.target.getAttribute('data-handle');
        } else {
            currentAction = 'move';
        }

        document.addEventListener('pointermove', doAction);
        document.addEventListener('pointerup', endAction);
        document.addEventListener('pointercancel', endAction);
    }

    function doAction(e) {
        if (!currentAction) return;
        e.preventDefault();
        const pos = clientPos(e);

        const dx = pos.x - startX;
        const dy = pos.y - startY;

        const maxW = cropWrapper.clientWidth;
        const maxH = sourceImg.clientHeight || cropWrapper.clientHeight;

        if (currentAction === 'move') {
            let newLeft = Math.max(0, Math.min(startLeft + dx, maxW - startWidth));
            let newTop = Math.max(0, Math.min(startTop + dy, maxH - startHeight));
            cropBox.style.left = newLeft + 'px';
            cropBox.style.top = newTop + 'px';
        } else if (currentAction === 'resize') {
            let newLeft = startLeft;
            let newTop = startTop;
            let newWidth = startWidth;
            let newHeight = startHeight;

            if (activeRatio > 0) {
                const dir = (activeHandle === 'tl' || activeHandle === 'bl') ? -1 : 1;
                let delta = dx * dir;
                newWidth = Math.max(40, startWidth + delta);
                newHeight = newWidth / activeRatio;

                if (activeHandle.includes('l')) newLeft = startLeft + (startWidth - newWidth);
                if (activeHandle.includes('t')) newTop = startTop + (startHeight - newHeight);

                if (newLeft < 0) { newWidth += newLeft; newHeight = newWidth / activeRatio; newLeft = 0; if(activeHandle.includes('t')) newTop = startTop + (startHeight - newHeight); }
                if (newTop < 0) { newHeight += newTop; newWidth = newHeight * activeRatio; newTop = 0; if(activeHandle.includes('l')) newLeft = startLeft + (startWidth - newWidth); }
                if (newLeft + newWidth > maxW) { newWidth = maxW - newLeft; newHeight = newWidth / activeRatio; }
                if (newTop + newHeight > maxH) { newHeight = maxH - newTop; newWidth = newHeight * activeRatio; }
            } else {
                if (activeHandle.includes('r')) newWidth = Math.max(40, Math.min(startWidth + dx, maxW - startLeft));
                if (activeHandle.includes('b')) newHeight = Math.max(40, Math.min(startHeight + dy, maxH - startTop));
                if (activeHandle.includes('l')) {
                    let potentialWidth = startWidth - dx;
                    if (potentialWidth >= 40 && startLeft + dx >= 0) {
                        newLeft = startLeft + dx;
                        newWidth = potentialWidth;
                    }
                }
                if (activeHandle.includes('t')) {
                    let potentialHeight = startHeight - dy;
                    if (potentialHeight >= 40 && startTop + dy >= 0) {
                        newTop = startTop + dy;
                        newHeight = potentialHeight;
                    }
                }
            }

            cropBox.style.left = newLeft + 'px';
            cropBox.style.top = newTop + 'px';
            cropBox.style.width = newWidth + 'px';
            cropBox.style.height = newHeight + 'px';
        }
        updatePreview();
    }

    function endAction(e) {
        currentAction = null;
        activeHandle = null;
        document.removeEventListener('pointermove', doAction);
        document.removeEventListener('pointerup', endAction);
        document.removeEventListener('pointercancel', endAction);
    }

    function updatePreview() {
        if (!sourceImg.naturalWidth) return;
        const ctx = previewCanvas.getContext('2d');
        const scaleX = sourceImg.naturalWidth / sourceImg.clientWidth;
        const scaleY = sourceImg.naturalHeight / sourceImg.clientHeight;

        const cropX = cropBox.offsetLeft * scaleX;
        const cropY = cropBox.offsetTop * scaleY;
        const cropW = cropBox.offsetWidth * scaleX;
        const cropH = cropBox.offsetHeight * scaleY;

        previewCanvas.width = cropW;
        previewCanvas.height = cropH;
        ctx.clearRect(0, 0, cropW, cropH);

        if (activeShape === 'circle') {
            ctx.save();
            ctx.beginPath();
            ctx.ellipse(cropW / 2, cropH / 2, cropW / 2, cropH / 2, 0, 0, Math.PI * 2);
            ctx.clip();
        }

        ctx.drawImage(sourceImg, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

        if (activeShape === 'circle') ctx.restore();

        previewCanvas.classList.toggle('round-preview', activeShape === 'circle');
    }

    window.addEventListener('resize', updatePreview);

    downloadBtn.addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = 'kirpilmis-gorsel.png';
        link.href = previewCanvas.toDataURL('image/png');
        link.click();
    });

    resetBtn.addEventListener('click', () => { location.reload(); });
})();
</script>
</body>
</html>
