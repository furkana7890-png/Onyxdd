<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hatasız Resim Kırpıcı </title>
    <style>
        :root {
            --bg-main: #0f1115;
            --bg-surface: #161920;
            --accent: #00f3ff;
            --accent-dim: rgba(0, 243, 255, 0.2);
            --text: #e2e8f0;
            --text-muted: #64748b;
            --border: #242936;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
        }

        header h1 span { color: var(--accent); }
        header p { color: var(--text-muted); margin-top: 5px; font-size: 14px; }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 25px;
            max-width: 1100px;
            width: 100%;
        }

        .workspace {
            background: var(--bg-surface);
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 450px;
            position: relative;
        }

        .upload-trigger { text-align: center; cursor: pointer; }
        .upload-trigger:hover { color: var(--accent); }
        .upload-trigger svg { width: 48px; height: 48px; margin-bottom: 15px; stroke: currentColor; }
        #file-input { display: none; }

        .crop-wrapper {
            position: relative;
            display: none;
            max-width: 100%;
        }

        #source-image {
            max-width: 100%;
            max-height: 500px;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Seçim Alanı ve Gölgeleme */
        .crop-box {
            position: absolute;
            box-sizing: border-box;
            border: 2px solid var(--accent);
            cursor: move;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
        }

        /* İç Kılavuz Çizgileri */
        .crop-grid {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
        }
        .crop-grid::before, .crop-grid::after {
            content: ''; position: absolute;
            background: rgba(0, 243, 255, 0.2);
        }
        .crop-grid::before {
            top: 33.33%; bottom: 33.33%; left: 0; right: 0;
            border-top: 1px dashed rgba(0,243,255,0.3); border-bottom: 1px dashed rgba(0,243,255,0.3);
        }
        .crop-grid::after {
            left: 33.33%; right: 33.33%; top: 0; bottom: 0;
            border-left: 1px dashed rgba(0,243,255,0.3); border-right: 1px dashed rgba(0,243,255,0.3);
        }

        /* 4 Köşedeki Tutamaçlar */
        .handle {
            position: absolute;
            width: 14px; height: 14px;
            background-color: #fff;
            border: 2px solid var(--accent);
            border-radius: 50%;
            z-index: 10;
        }
        .handle-tl { top: -7px; left: -7px; cursor: nwse-resize; }
        .handle-tr { top: -7px; right: -7px; cursor: nesw-resize; }
        .handle-bl { bottom: -7px; left: -7px; cursor: nesw-resize; }
        .handle-br { bottom: -7px; right: -7px; cursor: nwse-resize; }

        .control-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .preview-box {
            width: 100%; height: 180px;
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        #preview-canvas {
            max-width: 100%; max-height: 100%;
            background-color: #111;
        }

        .btn {
            background: #fff; color: #000; border: none;
            padding: 12px 20px; border-radius: 8px;
            font-weight: 600; cursor: pointer; width: 100%;
            transition: all 0.2s; display: flex; justify-content: center; align-items: center;
        }
        .btn-action { background: var(--accent); color: var(--bg-main); }
        .btn-reset { background: transparent; border: 1px solid var(--border); color: var(--text); }
    </style>
</head>
<body>

    <header>
        <h1>Gelişmiş Resim <span>Kırpıcı </span></h1>
        <p>Resmi sürükleyin, köşelerden dilediğiniz gibi büyütün ve indirin.</p>
    </header>

    <div class="main-container">
        <div class="workspace" id="drop-zone">
            <label class="upload-trigger" id="upload-ui">
                <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" /></svg>
                <p style="font-weight: 600;">Resmi buraya yükleyin veya sürükleyin</p>
                <input type="file" id="file-input" accept="image/*">
            </label>

            <div class="crop-wrapper" id="crop-wrapper">
                <img id="source-image" alt="Kaynak">
                <div class="crop-box" id="crop-box">
                    <div class="crop-grid"></div>
                    <div class="handle handle-tl" data-handle="tl"></div>
                    <div class="handle handle-tr" data-handle="tr"></div>
                    <div class="handle handle-bl" data-handle="bl"></div>
                    <div class="handle handle-br" data-handle="br"></div>
                </div>
            </div>
        </div>

        <div class="control-panel">
            <div>
                <h3 style="font-size: 14px; color: var(--text-muted); margin-bottom: 10px;">Önizleme</h3>
                <div class="preview-box">
                    <canvas id="preview-canvas"></canvas>
                </div>
            </div>
            <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
                <button class="btn btn-action" id="download-btn" disabled style="opacity: 0.5;">Kırp ve İndir</button>
                <button class="btn btn-reset" id="reset-btn">Resmi Değiştir</button>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const uploadUi = document.getElementById('upload-ui');
        const cropWrapper = document.getElementById('crop-wrapper');
        const sourceImg = document.getElementById('source-image');
        const cropBox = document.getElementById('crop-box');
        const previewCanvas = document.getElementById('preview-canvas');
        const downloadBtn = document.getElementById('download-btn');
        const resetBtn = document.getElementById('reset-btn');

        let currentAction = null; // 'move' veya 'resize'
        let activeHandle = null;
        let startX, startY, startLeft, startTop, startWidth, startHeight;

        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                sourceImg.src = e.target.result;
                sourceImg.onload = () => {
                    uploadUi.style.display = 'none';
                    cropWrapper.style.display = 'block';
                    
                    // Varsayılan kutu konumu
                    cropBox.style.left = '50px';
                    cropBox.style.top = '50px';
                    cropBox.style.width = '150px';
                    cropBox.style.height = '150px';
                    
                    downloadBtn.disabled = false;
                    downloadBtn.style.opacity = '1';
                    updatePreview();
                };
            };
            reader.readAsDataURL(file);
        });

        // Fare ve Dokunmatik Olayları Başlatma
        cropBox.addEventListener('mousedown', startAction);
        cropBox.addEventListener('touchstart', startAction, { passive: false });

        function startAction(e) {
            e.preventDefault();
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            
            startX = clientX;
            startY = clientY;
            startLeft = cropBox.offsetLeft;
            startTop = cropBox.offsetTop;
            startWidth = cropBox.offsetWidth;
            startHeight = cropBox.offsetHeight;

            if (e.target.classList.contains('handle')) {
                currentAction = 'resize';
                activeHandle = e.target.getAttribute('data-handle');
            } else {
                currentAction = 'move';
            }

            document.addEventListener('mousemove', doAction);
            document.addEventListener('touchmove', doAction, { passive: false });
            document.addEventListener('mouseup', endAction);
            document.addEventListener('touchend', endAction);
        }

        function doAction(e) {
            if (!currentAction) return;
            e.preventDefault();
            
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            if (!clientX || !clientY) return;

            const dx = clientX - startX;
            const dy = clientY - startY;

            const maxW = cropWrapper.clientWidth;
            const maxH = cropWrapper.clientHeight;

            if (currentAction === 'move') {
                let newLeft = Math.max(0, Math.min(startLeft + dx, maxW - startWidth));
                let newTop = Math.max(0, Math.min(startTop + dy, maxH - startHeight));
                cropBox.style.left = `${newLeft}px`;
                cropBox.style.top = `${newTop}px`;
            } 
            else if (currentAction === 'resize') {
                let newLeft = startLeft;
                let newTop = startTop;
                let newWidth = startWidth;
                let newHeight = startHeight;

                // Köşelere göre boyutlandırma hesapları
                if (activeHandle.includes('r')) newWidth = Math.max(40, Math.min(startWidth + dx, maxW - startLeft));
                if (activeHandle.includes('b')) newHeight = Math.max(40, Math.min(startHeight + dy, maxH - startTop));
                
                if (activeHandle.includes('l')) {
                    let potentialWidth = startWidth - dx;
                    if (potentialWidth >= 40 && startLeft + dx >= 0) {
                        newLeft = startLeft + dx;
                        newWidth = potentialWidth;
                    }
                }
                if (activeHandle.includes('t')) {
                    let potentialHeight = startHeight - dy;
                    if (potentialHeight >= 40 && startTop + dy >= 0) {
                        newTop = startTop + dy;
                        newHeight = potentialHeight;
                    }
                }

                cropBox.style.left = `${newLeft}px`;
                cropBox.style.top = `${newTop}px`;
                cropBox.style.width = `${newWidth}px`;
                cropBox.style.height = `${newHeight}px`;
            }
            updatePreview();
        }

        function endAction() {
            currentAction = null;
            activeHandle = null;
            document.removeEventListener('mousemove', doAction);
            document.removeEventListener('touchmove', doAction);
        }

        function updatePreview() {
            const ctx = previewCanvas.getContext('2d');
            const scaleX = sourceImg.naturalWidth / sourceImg.clientWidth;
            const scaleY = sourceImg.naturalHeight / sourceImg.clientHeight;

            const cropX = cropBox.offsetLeft * scaleX;
            const cropY = cropBox.offsetTop * scaleY;
            const cropW = cropBox.offsetWidth * scaleX;
            const cropH = cropBox.offsetHeight * scaleY;

            previewCanvas.width = cropW;
            previewCanvas.height = cropH;
            ctx.drawImage(sourceImg, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
        }

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'kirpilmis-gorsel.png';
            link.href = previewCanvas.toDataURL('image/png');
            link.click();
        });

        resetBtn.addEventListener('click', () => { location.reload(); });
    </script>
</body>
</html>
